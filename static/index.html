<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareCloud Dashboard</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-alt: #eff4ff;
        --primary: #1d4ed8;
        --primary-soft: #dfeafc;
        --text: #1f2937;
        --muted: #6b7280;
        --success: #15803d;
        --danger: #b91c1c;
        --border: #dfe7f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff, var(--bg));
        color: var(--text);
      }
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }
      .topbar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        box-shadow: 0 8px 24px rgba(29, 78, 216, 0.06);
      }
      .title {
        font-size: 1.2rem;
        font-weight: 700;
      }
      .badge {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
        margin-top: 22px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      }
      h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      input, button, select {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font-size: 0.95rem;
      }
      input { background: #fff; }
      button {
        background: var(--primary);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.2s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(29, 78, 216, 0.18);
      }
      button.secondary {
        background: #eef2ff;
        color: var(--primary);
      }
      button:disabled {
        opacity: 0.72;
        cursor: wait;
        transform: none;
        box-shadow: none;
      }
      .loading-spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        vertical-align: middle;
        margin-right: 8px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .patient-row {
        animation: fadeInUp 0.35s ease;
      }
      .patient-row:hover td {
        background: rgba(29, 78, 216, 0.03);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }
      th {
        color: var(--muted);
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .status.ok { background: #dcfce7; color: var(--success); }
      .status.warn { background: #fff7ed; color: #c2410c; }
      .form-grid {
        display: grid;
        gap: 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .note {
        margin-top: 18px;
        padding: 12px 14px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .error {
        background: #fef2f2;
        color: var(--danger);
        border: 1px solid #fecaca;
        padding: 10px 12px;
        border-radius: 10px;
        display: none;
        margin-bottom: 12px;
      }
      .error.visible { display: block; }
      @media (max-width: 820px) {
        .grid { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <div class="title">CareCloud Dashboard</div>
          <div class="muted">Patient management and quick lookup</div>
        </div>
        <div class="badge">Railway-hosted</div>
      </header>

      <div class="grid">
        <section class="panel">
          <h2>Patient Directory</h2>
          <div class="toolbar">
            <input id="lastName" placeholder="Last name" />
            <input id="dob" placeholder="DOB (YYYY-MM-DD)" />
            <input id="phone" placeholder="Phone" />
            <button id="loadBtn">Load Patients</button>
          </div>
          <div id="errorBox" class="error"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>DOB</th>
                  <th>Phone</th>
                  <th>State</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="patientTableBody"></tbody>
            </table>
          </div>
        </section>

        <aside class="panel">
          <h2>Add Patient</h2>
          <form id="patientForm" class="form-grid">
            <div class="row">
              <input name="first_name" placeholder="First name" required />
              <input name="last_name" placeholder="Last name" required />
            </div>
            <div class="row">
              <input name="date_of_birth" placeholder="Date of birth (YYYY-MM-DD)" required />
              <input name="sex" placeholder="Sex" required />
            </div>
            <div class="row">
              <input name="phone_number" placeholder="Phone number" required />
              <input name="email" placeholder="Email" />
            </div>
            <input name="address_line_1" placeholder="Address line 1" required />
            <input name="address_line_2" placeholder="Address line 2" />
            <div class="row">
              <input name="city" placeholder="City" required />
              <input name="state" placeholder="State" required />
            </div>
            <div class="row">
              <input name="zip_code" placeholder="ZIP" required />
              <input name="preferred_language" placeholder="Preferred language" value="English" />
            </div>
            <button type="submit">Create Patient</button>
          </form>
        
        </aside>
      </div>
    </div>

    <script>
      const apiBase = window.location.origin;
      const errorBox = document.getElementById('errorBox');
      const loadBtn = document.getElementById('loadBtn');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('visible');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.remove('visible');
      }

      function setLoadingState(button, isLoading, label = 'Loading...') {
        if (!button) return;
        if (!button.dataset.defaultLabel) {
          button.dataset.defaultLabel = button.textContent.trim();
        }

        if (isLoading) {
          button.disabled = true;
          button.innerHTML = `<span class="loading-spinner"></span><span>${label}</span>`;
          return;
        }

        button.disabled = false;
        button.innerHTML = button.dataset.defaultLabel;
      }

      async function loadPatients() {
        clearError();
        setLoadingState(loadBtn, true, 'Loading patients');

        try {
          const params = new URLSearchParams();
          const lastName = document.getElementById('lastName').value.trim();
          const dob = document.getElementById('dob').value.trim();
          const phone = document.getElementById('phone').value.trim();

          if (lastName) params.set('last_name', lastName);
          if (dob) params.set('date_of_birth', dob);
          if (phone) params.set('phone_number', phone);

          const url = `${apiBase}/patients${params.toString() ? `?${params}` : ''}`;
          const res = await fetch(url);
          const json = await res.json();

          if (!res.ok) {
            showError(json?.error?.message || 'Unable to load patients');
            return;
          }

          const rows = json.data || [];
          const tbody = document.getElementById('patientTableBody');
          tbody.innerHTML = '';

          if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="muted">No patients found.</td></tr>';
            return;
          }

          rows.forEach((patient) => {
            const tr = document.createElement('tr');
            tr.className = 'patient-row';
            const name = `${patient.first_name || ''} ${patient.last_name || ''}`.trim();
            tr.innerHTML = `
              <td>${name}</td>
              <td>${patient.date_of_birth || '-'}</td>
              <td>${patient.phone_number || '-'}</td>
              <td>${patient.state || '-'}</td>
              <td><button class="secondary" type="button" data-id="${patient.patient_id}">View</button></td>
            `;
            tbody.appendChild(tr);
          });

          tbody.querySelectorAll('button').forEach((button) => {
            button.addEventListener('click', async () => {
              setLoadingState(button, true, 'Loading');
              try {
                const patientId = button.dataset.id;
                const record = await fetch(`${apiBase}/patients/${patientId}`).then((r) => r.json());
                const detail = JSON.stringify(record.data || {}, null, 2);
                alert(detail);
              } finally {
                setLoadingState(button, false);
              }
            });
          });
        } finally {
          setLoadingState(loadBtn, false);
        }
      }

      loadBtn.addEventListener('click', loadPatients);

      document.getElementById('patientForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError();
        const form = event.currentTarget;
        const submitBtn = form.querySelector('button[type="submit"]');
        const payload = Object.fromEntries(new FormData(form).entries());

        setLoadingState(submitBtn, true, 'Creating...');

        try {
          const res = await fetch(`${apiBase}/patients`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const json = await res.json();
          if (!res.ok) {
            showError(json?.error?.message || 'Unable to create patient');
            return;
          }

          form.reset();
          await loadPatients();
          alert('Patient created successfully');
        } finally {
          setLoadingState(submitBtn, false);
        }
      });

      loadPatients();
    </script>
  </body>
</html>
